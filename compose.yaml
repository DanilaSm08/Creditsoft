name: creditsoft
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: creditsoft
      POSTGRES_DB: creditsoft
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditsoft -d creditsoft"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  web:
    build: .
    image: creditsoft:local
    environment:
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,testserver
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [django_secret, postgres_password]
    volumes: ["static:/app/staticfiles"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
secrets:
  django_secret:
    file: ./.local/django_secret
  postgres_password:
    file: ./.local/postgres_password
volumes:
  database:
  static:
